<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synthetic Student</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #ffffff;
  --fg: oklch(0.21 0.006 265);
  --muted: oklch(0.47 0.01 265);
  --surface: oklch(0.975 0.002 265);
  --raised: #ffffff;
  --border: oklch(0.9 0.004 265);
  --border-strong: oklch(0.78 0.006 265);
  --focus: oklch(0.55 0.15 255);
  --ok: oklch(0.5 0.13 150);
  --ok-bg: oklch(0.96 0.03 150);
  --part: oklch(0.52 0.12 70);
  --part-bg: oklch(0.96 0.04 85);
  --bad: oklch(0.52 0.18 25);
  --bad-bg: oklch(0.96 0.03 25);
  --fix: oklch(0.5 0.14 255);
  --fix-bg: oklch(0.95 0.03 255);
  --radius: 0.375rem;
  --sans: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: oklch(0.165 0.006 265);
    --fg: oklch(0.94 0.004 265);
    --muted: oklch(0.7 0.008 265);
    --surface: oklch(0.19 0.006 265);
    --raised: oklch(0.215 0.007 265);
    --border: oklch(0.28 0.008 265);
    --border-strong: oklch(0.4 0.01 265);
    --focus: oklch(0.72 0.13 255);
    --ok: oklch(0.78 0.14 150);
    --ok-bg: oklch(0.25 0.04 150);
    --part: oklch(0.82 0.13 85);
    --part-bg: oklch(0.26 0.04 85);
    --bad: oklch(0.74 0.15 25);
    --bad-bg: oklch(0.26 0.05 25);
    --fix: oklch(0.76 0.12 255);
    --fix-bg: oklch(0.25 0.05 255);
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.5 var(--sans);
}
main { max-width: 56rem; margin: 0 auto; padding: 24px 16px 140px; }
h1 { font-size: 1.5rem; line-height: 1.25; margin: 0 0 4px; }
h2 { font-size: 1rem; margin: 0; min-width: 0; }
p { margin: 0; }
button, select, textarea, input { font: inherit; color: inherit; }
button {
  min-height: 36px;
  padding: 6px 12px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  background: var(--raised);
  cursor: pointer;
}
button:hover { background: var(--surface); }
button.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
button[disabled] { opacity: 0.5; cursor: default; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
select, textarea {
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  background: var(--raised);
  padding: 6px 8px;
}
textarea { width: 100%; min-height: 64px; resize: vertical; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.meta { color: var(--muted); }
.reason { margin-top: 8px; }

.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 20px 0; }
.stat { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; background: var(--surface); }
.stat .big { font-size: 1.375rem; font-weight: 600; }

.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; white-space: nowrap; color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--fg); font-weight: 600; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
label.check { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }

.card { border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; background: var(--bg); }
.card.partial { background: var(--part-bg); border-color: var(--part); }
.card.wrong { background: var(--bad-bg); border-color: var(--bad); }
.card-head { display: flex; gap: 10px; align-items: baseline; }
.card-head h2 { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.num { color: var(--muted); font-family: var(--mono); }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 0.8125rem; font-weight: 600; padding: 1px 8px; border-radius: var(--radius); border: 1px solid currentColor; white-space: nowrap; }
.badge.correct { color: var(--ok); }
.badge.partial { color: var(--part); }
.badge.wrong { color: var(--bad); }
.badge.fixed { color: var(--fix); }
.badge.checked { color: var(--ok); }
.badges { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.secs { font-family: var(--mono); color: var(--muted); white-space: nowrap; }

details { margin-top: 8px; }
summary { cursor: pointer; color: var(--muted); }
.stem { white-space: pre-wrap; margin-top: 6px; }
.context { white-space: pre-wrap; margin-top: 6px; padding: 8px 10px; border-left: 3px solid var(--border-strong); color: var(--muted); }

.block { margin-top: 10px; }
.block-label { font-size: 0.8125rem; font-weight: 600; color: var(--muted); margin-bottom: 2px; }
ul.opts { list-style: none; margin: 0; padding: 0; }
ul.opts li { display: flex; gap: 8px; padding: 3px 0; }
.icon { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.125em; }
.badge .icon { width: 0.875em; height: 0.875em; }
ul.opts .mark { flex: none; width: 1.25em; display: inline-flex; align-items: center; justify-content: center; height: 1.5em; }
ul.opts .pair { flex: none; display: inline-flex; gap: 6px; align-items: center; margin-left: auto; padding-left: 12px; }
ul.opts .mark.correct { color: var(--ok); }
ul.opts .mark.wrong { color: var(--bad); }
ul.opts .letter { flex: none; font-weight: 600; font-family: var(--mono); }
ul.opts .text { min-width: 0; }
ul.opts li.key .text { font-weight: 600; }
ul.opts li.key .pair strong, ul.opts .pair strong { font-family: var(--mono); }
ul.opts li.dim { color: var(--muted); }
.note { margin-top: 8px; font-style: italic; }

.player { border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; background: var(--surface); }
.player-top { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; }
.countdown { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 3rem; font-weight: 600; line-height: 1; }
.bar { height: 8px; border-radius: var(--radius); background: var(--border); overflow: hidden; margin: 12px 0; }
.bar > div { height: 100%; background: var(--fg); width: 0; }
.player .card { margin: 12px 0 0; }
.done { padding: 24px 0; text-align: center; }
.timeup { margin: 12px 0 0; padding: 8px 12px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--raised); font-weight: 600; }

.fixbar {
  position: fixed; left: 0; right: 0; bottom: 0;
  background: var(--raised); border-top: 1px solid var(--border);
}
.fixbar-inner { max-width: 56rem; margin: 0 auto; padding: 10px 16px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.editor { margin-top: 10px; padding: 12px; border: 1px solid var(--fix); border-radius: var(--radius); background: var(--fix-bg); }
.editor .row { display: flex; gap: 8px; align-items: center; padding: 3px 0; }
.editor .row .text { flex: 1; min-width: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.copybox { margin-top: 10px; }
.copybox textarea { min-height: 120px; font-family: var(--mono); font-size: 0.8125rem; }
.empty { padding: 24px; text-align: center; color: var(--muted); border: 1px dashed var(--border-strong); border-radius: var(--radius); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main id="app"></main>
<script type="application/json" id="run-data">null</script>
<script>
(() => {
  const L = {
    de: {
      pass: "Durchgang", passes: "Durchgänge", flow: "Ablauf", keys: "Lösungen",
      correct: "richtig", partial: "teilweise", wrong: "falsch", fixedBadge: "korrigiert", pending: "Korrektur offen",
      answer: "Antwort", solution: "Lösung", note: "Anmerkung", question: "Frage", context: "Fallbeschreibung",
      showStem: "Fragetext anzeigen", onlyWrong: "Nur Fehler anzeigen", total: "Gesamtzeit", avg: "Ø Sek.",
      score: "Ergebnis", start: "Start", pause: "Pause", resume: "Weiter", prev: "Zurück", next: "Nächste",
      restart: "Neu starten", elapsed: "Vergangen", remaining: "Verbleibend", beep: "Signalton bei Wechsel",
      finished: "Durchgang beendet", finish: "Abschließen", timeUpTitle: "Zeit um",
      timeUp: "Zeit abgelaufen. Weiter mit „Nächste“ oder der rechten Pfeiltaste.", select: "Auswählen", markWrong: "Lösung ist falsch", save: "Speichern",
      cancel: "Abbrechen", undo: "Korrektur entfernen", notePh: "Begründung (optional)",
      copy: "Korrekturen kopieren", copied: "Kopiert. In den nächsten Prompt einfügen.",
      copyManual: "Text markieren und kopieren, dann in den nächsten Prompt einfügen.",
      pendingCount: n => n === 1 ? "1 Korrektur offen" : n + " Korrekturen offen",
      reviewedCount: n => n + " geprüft",
      matchesAnswer: "Entspricht der Antwort.", confirm: "Passt", confirmed: "geprüft", editFix: "Korrektur bearbeiten",
      noErrors: "In diesem Durchgang gibt es keine Fehler.",
      chooseOne: "Mindestens eine Option wählen.",
      noData: "Keine Daten. Diese Datei ist die leere Vorlage; erzeuge einen Bericht mit render.py.",
      of: "von", s: "s",
    },
    en: {
      pass: "Pass", passes: "passes", flow: "Play-along", keys: "Answer key",
      correct: "correct", partial: "partial", wrong: "wrong", fixedBadge: "corrected", pending: "correction pending",
      answer: "Answer", solution: "Solution", note: "Note", question: "Question", context: "Case",
      showStem: "Show question text", onlyWrong: "Show mistakes only", total: "Total time", avg: "Avg s",
      score: "Score", start: "Start", pause: "Pause", resume: "Resume", prev: "Previous", next: "Next",
      restart: "Restart", elapsed: "Elapsed", remaining: "Remaining", beep: "Beep on next question",
      finished: "Pass finished", finish: "Finish", timeUpTitle: "Time's up",
      timeUp: "Time's up. Continue with Next or the right arrow key.", select: "Select", markWrong: "Key is wrong", save: "Save",
      cancel: "Cancel", undo: "Remove correction", notePh: "Reason (optional)",
      copy: "Copy corrections", copied: "Copied. Paste it into your next prompt.",
      copyManual: "Select and copy this text, then paste it into your next prompt.",
      pendingCount: n => n === 1 ? "1 correction pending" : n + " corrections pending",
      reviewedCount: n => n + " checked",
      matchesAnswer: "Same as the answer.", confirm: "Looks right", confirmed: "checked", editFix: "Edit correction",
      noErrors: "No mistakes in this pass.",
      chooseOne: "Choose at least one option.",
      noData: "No data. This file is the empty template; create a report with render.py.",
      of: "of", s: "s",
    },
  };

  const app = document.getElementById("app");
  const run = JSON.parse(document.getElementById("run-data").textContent);
  const t = L[(run && run.lang) || "de"] || L.de;

  const h = (tag, attrs, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, "");
      else el.setAttribute(k, v);
    }
    for (const kid of kids.flat()) {
      if (kid == null || kid === false) continue;
      el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    }
    return el;
  };
  const mmss = s => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
  const ICONS = {
    correct: "M3.5 8.5l3 3 6-7",
    wrong: "M4 4l8 8M12 4l-8 8",
    partial: "M8 2.5a5.5 5.5 0 1 0 0 11a5.5 5.5 0 1 0 0-11M8 2.5v11",
    arrow: "M2.5 8h10M9 4.5L12.5 8 9 11.5",
    edit: "M10.5 2.5l3 3-7.5 7.5H3v-3z",
  };
  const icon = (name, label) => {
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 16 16");
    svg.setAttribute("class", "icon");
    if (label) { svg.setAttribute("role", "img"); svg.setAttribute("aria-label", label); }
    else svg.setAttribute("aria-hidden", "true");
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", ICONS[name]);
    svg.append(path);
    return svg;
  };
  const badge = r => h("span", { class: "badge " + r }, icon(r), t[r]);
  const mark = (ok, show) => h("span", { class: "mark " + (ok ? "correct" : "wrong") },
    show ? icon(ok ? "correct" : "wrong", ok ? t.correct : t.wrong) : null);

  if (!run) { app.append(h("p", { class: "empty" }, t.noData)); return; }
  document.documentElement.lang = run.lang || "de";
  document.title = run.title || document.title;

  const qByN = new Map(run.questions.map(q => [q.n, q]));

  // ---------- review state: corrections + checked keys (localStorage, optional) ----------
  const storeKey = "synthetic-student:" + location.pathname;
  const stored = (() => { try { return JSON.parse(localStorage.getItem(storeKey)) || {}; } catch { return {}; } })();
  const fixes = stored.fixes || {};
  const reviewed = stored.reviewed || {};
  const saveState = () => {
    try { localStorage.setItem(storeKey, JSON.stringify({ fixes, reviewed })); } catch { /* storage unavailable */ }
  };

  // ---------- effective key and passes: corrections apply immediately ----------
  // Every pass is re-scored against the corrected key, and the final pass (always fully correct)
  // answers with the corrected key.
  const keyOf = q => (fixes[q.n] ? fixes[q.n].key : q.key);
  function scoreAnswer(q, sel, key) {
    if (q.type === "multi") {
      const hits = sel.filter(x => key.includes(x)).length;
      if (hits === key.length && sel.length === key.length) return "correct";
      return hits ? "partial" : "wrong";
    }
    const ids = Object.keys(q.items);
    const right = ids.filter(id => sel[id] === key[id]).length;
    return right === ids.length ? "correct" : right ? "partial" : "wrong";
  }
  let passes = [];
  function derivePasses() {
    const lastIdx = run.passes.length - 1;
    passes = run.passes.map((p, i) => {
      const answers = p.answers.map(a => {
        const q = qByN.get(a.n);
        const key = keyOf(q);
        const selected = i === lastIdx && fixes[q.n] ? key : a.selected;
        const result = scoreAnswer(q, selected, key);
        return { ...a, selected, result, note: result === "correct" ? "" : a.note };
      });
      return { ...p, answers, correct: answers.filter(a => a.result === "correct").length, total: answers.length };
    });
  }
  derivePasses();

  // ---------- answer rendering ----------
  function answerList(q, sel, compareToKey) {
    const ul = h("ul", { class: "opts" });
    if (q.type === "multi") {
      for (const letter of sel) {
        const ok = keyOf(q).includes(letter);
        ul.append(h("li", {},
          mark(ok, compareToKey),
          h("span", { class: "letter" }, letter + ")"),
          h("span", { class: "text" }, q.options[letter])));
      }
    } else {
      for (const [id, text] of Object.entries(q.items)) {
        const ok = sel[id] === keyOf(q)[id];
        ul.append(h("li", {},
          mark(ok, compareToKey),
          h("span", { class: "text" }, text),
          h("span", { class: "pair" }, icon("arrow"), h("strong", {}, sel[id]))));
      }
    }
    return ul;
  }

  function stemDetails(q, open) {
    return h("details", { open },
      h("summary", {}, t.showStem),
      q.context ? h("div", { class: "context" }, q.context) : null,
      h("div", { class: "stem" }, q.stem));
  }

  function questionCard(q, a, opts = {}) {
    const wrongish = a.result !== "correct";
    return h("article", { class: "card " + (wrongish ? a.result : "") },
      h("div", { class: "card-head" },
        h("span", { class: "num" }, q.n),
        h("h2", { title: q.label }, q.label),
        badge(a.result),
        h("span", { class: "secs" }, a.seconds + " " + t.s)),
      stemDetails(q, opts.openStem),
      h("div", { class: "block" },
        h("div", { class: "block-label" }, t.answer),
        answerList(q, a.selected, wrongish)),
      wrongish ? h("div", { class: "block" },
        h("div", { class: "block-label" }, t.solution),
        answerList(q, keyOf(q), false)) : null,
      wrongish && a.note ? h("p", { class: "note" }, t.note + ": " + a.note) : null);
  }

  // ---------- layout ----------
  const header = h("header", {},
    h("h1", {}, run.title || "Quiz"),
    h("p", { class: "meta" }, [run.created ? run.created.replace("T", " ") : null, run.questions.length + " " + t.question + (run.lang === "en" ? "s" : "n"), passes.length + " " + t.passes].filter(Boolean).join(" · ")),
    run.passReason ? h("p", { class: "reason" }, run.passReason) : null);

  const summary = h("section", { class: "summary" });
  function drawSummary() {
    summary.replaceChildren(...passes.map((p, i) => h("div", { class: "stat" },
      h("div", { class: "muted" }, t.pass + " " + (i + 1)),
      h("div", { class: "big mono" }, p.correct + "/" + p.total),
      h("div", { class: "muted mono" }, mmss(p.seconds) + " · " + t.avg + " " + Math.round(p.seconds / p.total)))));
  }
  drawSummary();

  const tabNames = passes.map((_, i) => t.pass + " " + (i + 1)).concat([t.flow, t.keys]);
  const panels = tabNames.map(() => h("section", { role: "tabpanel" }));
  const tabButtons = tabNames.map((name, i) => h("button", {
    role: "tab", "aria-selected": i === 0 ? "true" : "false",
    onclick: () => selectTab(i),
  }, name));
  const tabs = h("nav", { class: "tabs", role: "tablist" }, tabButtons);
  function selectTab(i) {
    tabButtons.forEach((b, j) => b.setAttribute("aria-selected", i === j ? "true" : "false"));
    panels.forEach((p, j) => { p.hidden = i !== j; });
    try { sessionStorage.setItem(storeKey + ":tab", String(i)); } catch { /* ignore */ }
  }

  // ---------- pass panels ----------
  const passDraws = passes.map((_, i) => {
    const panel = panels[i];
    const list = h("div");
    const scoreLine = h("span", { class: "muted" });
    let onlyWrong = false;
    const draw = () => {
      const p = passes[i];
      scoreLine.textContent = t.score + ": " + p.correct + "/" + p.total + " · " + t.total + " " + mmss(p.seconds);
      const shown = p.answers.filter(a => !onlyWrong || a.result !== "correct");
      list.replaceChildren(...(shown.length ? shown.map(a => questionCard(qByN.get(a.n), a)) : [h("p", { class: "empty" }, t.noErrors)]));
    };
    panel.append(
      h("div", { class: "toolbar" },
        h("label", { class: "check" },
          h("input", { type: "checkbox", onchange: e => { onlyWrong = e.target.checked; draw(); } }), t.onlyWrong),
        scoreLine),
      list);
    draw();
    return draw;
  });

  // ---------- play-along timer ----------
  const flow = panels[passes.length];
  const player = { pass: 0, idx: 0, remainingMs: 0, running: false, last: 0, timer: null, finished: false, timeUp: false };
  let beepOn = false;
  const passSelect = h("select", { "aria-label": t.pass, onchange: e => { player.pass = Number(e.target.value); reset(); } },
    passes.map((_, i) => h("option", { value: i }, t.pass + " " + (i + 1))));
  const startBtn = h("button", { class: "primary", onclick: toggle }, t.start);
  const prevBtn = h("button", { onclick: () => jump(-1) }, t.prev);
  const nextBtn = h("button", { onclick: () => jump(1) }, t.next);
  const restartBtn = h("button", { onclick: reset }, t.restart);
  const position = h("span", { class: "muted mono" });
  const countdown = h("div", { class: "countdown", role: "timer", "aria-live": "off" });
  const bar = h("div");
  const totals = h("div", { class: "muted mono" });
  const stage = h("div");
  const timeUpLine = h("p", { class: "timeup", role: "status", hidden: true }, t.timeUp);
  flow.append(
    h("div", { class: "toolbar" }, passSelect, startBtn, prevBtn, nextBtn, restartBtn,
      h("label", { class: "check" }, h("input", { type: "checkbox", onchange: e => { beepOn = e.target.checked; } }), t.beep)),
    h("div", { class: "player" },
      h("div", { class: "player-top" }, h("div", {}, position, countdown), totals),
      h("div", { class: "bar", role: "progressbar", "aria-label": t.remaining }, bar),
      timeUpLine,
      stage));

  const cur = () => passes[player.pass].answers;
  function beep() {
    if (!beepOn) return;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator(); const gain = ctx.createGain();
      osc.frequency.value = 880; gain.gain.value = 0.08;
      osc.connect(gain).connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.15);
      osc.onended = () => ctx.close();
    } catch { /* audio unavailable */ }
  }
  function renderStage() {
    if (player.finished) return;
    const a = cur()[player.idx];
    stage.replaceChildren(flowCard(qByN.get(a.n), a));
  }
  function loadQuestion() {
    player.remainingMs = cur()[player.idx].seconds * 1000;
    renderStage();
  }
  function pauseFlow() { if (player.running) { stop(); paint(); } }
  function reset() {
    stop(); player.idx = 0; player.finished = false; player.timeUp = false; loadQuestion(); paint();
  }
  function stop() {
    player.running = false; clearInterval(player.timer); player.timer = null;
  }
  function start() {
    player.running = true; player.last = performance.now(); player.timer = setInterval(tick, 200);
  }
  // Primary button and Space: restart when finished, advance after time is up, otherwise start/pause.
  function toggle() {
    if (player.finished) { reset(); start(); }
    else if (player.timeUp) { jump(1); return; }
    else if (player.running) stop();
    else start();
    paint();
  }
  function jump(d) {
    const wasUp = player.timeUp;
    const n = player.idx + d;
    if (n >= cur().length) {
      if (wasUp) { stop(); player.timeUp = false; player.finished = true; paint(); }
      return;
    }
    if (n < 0) return;
    player.idx = n; player.finished = false; player.timeUp = false;
    loadQuestion(); player.last = performance.now();
    if (wasUp && d > 0) start();
    paint();
  }
  // When the countdown ends, stay on the question until the user moves on.
  function tick() {
    const now = performance.now();
    player.remainingMs -= now - player.last; player.last = now;
    if (player.remainingMs <= 0) {
      player.remainingMs = 0; stop(); player.timeUp = true; beep();
    }
    paint();
  }
  function paint() {
    const answers = cur();
    const total = passes[player.pass].seconds;
    const before = answers.slice(0, player.idx).reduce((s, a) => s + a.seconds, 0);
    const curSecs = answers[player.idx].seconds;
    const elapsed = before + (curSecs - player.remainingMs / 1000);
    position.textContent = t.question + " " + (player.idx + 1) + " " + t.of + " " + answers.length;
    countdown.textContent = mmss(Math.ceil(player.remainingMs / 1000));
    bar.style.width = (100 * (1 - player.remainingMs / (curSecs * 1000))) + "%";
    totals.textContent = t.elapsed + " " + mmss(elapsed) + " · " + t.remaining + " " + mmss(Math.max(0, total - elapsed));
    const last = player.idx === answers.length - 1;
    startBtn.textContent = player.finished ? t.restart
      : player.timeUp ? (last ? t.finish : t.next)
      : player.running ? t.pause : (elapsed > 0 ? t.resume : t.start);
    prevBtn.disabled = player.idx === 0;
    nextBtn.disabled = last;
    nextBtn.hidden = player.timeUp;
    timeUpLine.hidden = !player.timeUp || player.finished;
    if (player.finished) {
      const p = passes[player.pass];
      stage.replaceChildren(h("div", { class: "done" },
        h("h2", {}, t.finished),
        h("p", { class: "muted mono" }, t.score + " " + p.correct + "/" + p.total + " · " + t.total + " " + mmss(p.seconds))));
    }
    document.title = player.timeUp ? "0:00 · " + t.timeUpTitle + " · " + t.question + " " + (player.idx + 1)
      : player.running ? mmss(Math.ceil(player.remainingMs / 1000)) + " · " + t.question + " " + (player.idx + 1)
      : (run.title || "Quiz");
  }
  document.addEventListener("keydown", e => {
    if (flow.hidden || e.target.closest("input, textarea, select")) return;
    if (e.key === " ") { if (e.target.closest("button")) return; e.preventDefault(); toggle(); }
    else if (e.key === "ArrowLeft") jump(-1);
    else if (e.key === "ArrowRight") jump(1);
  });
  reset();

  // ---------- answer key review + corrections (shared by Ablauf and Lösungen) ----------
  const keysPanel = panels[passes.length + 1];
  const keyList = h("div");
  const fixbarText = h("span");
  const copyBox = h("div", { class: "copybox", hidden: true });
  const copyBtn = h("button", { class: "primary", onclick: copyFixes }, t.copy);
  const fixbar = h("div", { class: "fixbar", hidden: true },
    h("div", { class: "fixbar-inner" }, fixbarText, copyBtn));
  keysPanel.append(keyList, copyBox);

  const known = obj => Object.keys(obj).filter(k => qByN.has(Number(k)));

  function statusBadges(q) {
    return h("span", { class: "badges" },
      fixes[q.n] ? h("span", { class: "badge fixed" }, icon("edit"), t.pending)
        : q.corrected ? h("span", { class: "badge fixed" }, icon("correct"), t.fixedBadge) : null,
      reviewed[q.n] && !fixes[q.n] ? h("span", { class: "badge checked" }, icon("correct"), t.confirmed) : null);
  }

  // Review row: "Passt" / "Lösung ist falsch" (+ remove correction). Editing swaps the row for the editor.
  function reviewRow(q, onEditStart) {
    const fix = fixes[q.n];
    const row = h("div", { class: "actions" },
      fix ? null : h("button", {
        "aria-pressed": reviewed[q.n] ? "true" : "false",
        onclick: () => { if (reviewed[q.n]) delete reviewed[q.n]; else reviewed[q.n] = true; saveState(); refreshReview(); },
      }, reviewed[q.n] ? [icon("correct"), " " + t.confirmed] : t.confirm),
      h("button", { onclick: () => { if (onEditStart) onEditStart(); row.replaceWith(correctionEditor(q, refreshReview)); } },
        fix ? t.editFix : t.markWrong),
      fix ? h("button", { onclick: () => { delete fixes[q.n]; saveState(); refreshReview(); } }, t.undo) : null);
    return row;
  }

  function correctionEditor(q, onDone) {
    const fix = fixes[q.n];
    const key = fix ? fix.key : q.key;
    const err = h("p", { class: "note", role: "alert" });
    const note = h("textarea", { placeholder: t.notePh, "aria-label": t.note });
    note.value = fix ? fix.note : "";
    const inputs = {};
    const rows = h("div");
    if (q.type === "multi") {
      for (const [letter, text] of Object.entries(q.options)) {
        const cb = h("input", { type: "checkbox", id: `fix-${q.n}-${letter}-${Math.random().toString(36).slice(2, 7)}` });
        cb.checked = key.includes(letter);
        inputs[letter] = cb;
        rows.append(h("label", { class: "row", for: cb.id }, cb, h("span", { class: "letter mono" }, letter + ")"), h("span", { class: "text" }, text)));
      }
    } else {
      for (const [id, text] of Object.entries(q.items)) {
        const sel = h("select", { "aria-label": text }, q.choices.map(c => h("option", { value: c, selected: c === key[id] }, c)));
        inputs[id] = sel;
        rows.append(h("div", { class: "row" }, h("span", { class: "text" }, text), sel));
      }
    }
    const save = () => {
      let newKey;
      if (q.type === "multi") {
        newKey = Object.keys(inputs).filter(k => inputs[k].checked);
        if (!newKey.length) { err.textContent = t.chooseOne; return; }
      } else {
        newKey = Object.fromEntries(Object.entries(inputs).map(([k, s]) => [k, s.value]));
      }
      fixes[q.n] = { key: newKey, note: note.value.trim() };
      delete reviewed[q.n];
      saveState(); onDone();
    };
    const box = h("div", { class: "editor" }, rows, h("div", { class: "block" }, note), err,
      h("div", { class: "actions" },
        h("button", { class: "primary", onclick: save }, t.save),
        h("button", { onclick: onDone }, t.cancel)));
    return box;
  }

  // Ablauf card: answer, what would have been right, and the review row.
  function flowCard(q, a) {
    const fix = fixes[q.n];
    const wrongish = a.result !== "correct";
    const solution = wrongish ? answerList(q, keyOf(q), false) : h("p", { class: "muted" }, t.matchesAnswer);
    return h("article", { class: "card " + (wrongish ? a.result : "") },
      h("div", { class: "card-head" },
        h("span", { class: "num" }, q.n),
        h("h2", { title: q.label }, q.label),
        badge(a.result),
        h("span", { class: "secs" }, a.seconds + " " + t.s)),
      stemDetails(q, true),
      h("div", { class: "block" }, h("div", { class: "block-label" }, t.answer), answerList(q, a.selected, wrongish)),
      h("div", { class: "block" },
        h("div", { class: "block-label" }, t.solution, " ", statusBadges(q)),
        solution),
      wrongish && a.note ? h("p", { class: "note" }, t.note + ": " + a.note) : null,
      fix && fix.note ? h("p", { class: "note" }, t.note + " (" + t.pending + "): " + fix.note) : null,
      reviewRow(q, pauseFlow));
  }

  function keyCard(q) {
    const fix = fixes[q.n];
    const key = fix ? fix.key : q.key;
    const ul = h("ul", { class: "opts" });
    if (q.type === "multi") {
      for (const [letter, text] of Object.entries(q.options)) {
        const on = key.includes(letter);
        ul.append(h("li", { class: on ? "key" : "dim" },
          mark(true, on),
          h("span", { class: "letter" }, letter + ")"),
          h("span", { class: "text" }, text)));
      }
    } else {
      for (const [id, text] of Object.entries(q.items)) {
        ul.append(h("li", { class: "key" }, mark(true, false), h("span", { class: "text" }, text),
          h("span", { class: "pair" }, icon("arrow"), h("strong", {}, key[id]))));
      }
    }
    return h("article", { class: "card" },
      h("div", { class: "card-head" },
        h("span", { class: "num" }, q.n),
        h("h2", { title: q.label }, q.label),
        statusBadges(q)),
      stemDetails(q, false),
      h("div", { class: "block" }, ul),
      fix && fix.note ? h("p", { class: "note" }, t.note + ": " + fix.note) : null,
      reviewRow(q));
  }

  function refreshReview() {
    derivePasses();
    drawSummary();
    passDraws.forEach(draw => draw());
    keyList.replaceChildren(...run.questions.map(keyCard));
    renderStage();
    paint();
    const nFix = known(fixes).length;
    const nRev = known(reviewed).length;
    fixbarText.textContent = [nRev ? t.reviewedCount(nRev) : null, nFix ? t.pendingCount(nFix) : null].filter(Boolean).join(" · ");
    fixbar.hidden = nFix === 0 && nRev === 0;
    copyBtn.hidden = nFix === 0;
    if (nFix === 0) copyBox.hidden = true;
  }

  function fixesBlock() {
    const items = known(fixes).map(n => {
      const q = qByN.get(Number(n));
      const fix = fixes[n];
      const item = { label: q.label, type: q.type, stem: q.stem };
      if (q.context) item.context = q.context;
      if (q.type === "multi") item.options = q.options;
      else { item.items = q.items; item.choices = q.choices; }
      item.key = fix.key;
      if (fix.note) item.note = fix.note;
      return item;
    });
    return "synthetic-student corrections v1\n" + JSON.stringify({ items });
  }

  async function copyFixes() {
    const text = fixesBlock();
    copyBox.hidden = false;
    try {
      await navigator.clipboard.writeText(text);
      copyBox.replaceChildren(h("p", { role: "status" }, t.copied));
    } catch {
      const ta = h("textarea", { readonly: true, "aria-label": t.copy });
      ta.value = text;
      copyBox.replaceChildren(h("p", { role: "status" }, t.copyManual), ta);
      ta.focus(); ta.select();
    }
  }

  refreshReview();
  app.append(header, summary, tabs, ...panels, fixbar);
  let initial = 0;
  try { initial = Number(sessionStorage.getItem(storeKey + ":tab")) || 0; } catch { /* ignore */ }
  selectTab(initial < tabNames.length ? initial : 0);
})();
</script>
</body>
</html>
